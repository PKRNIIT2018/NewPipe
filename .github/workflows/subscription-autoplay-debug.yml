name: Subscription autoplay debug APK

on:
  push:
    branches:
      - feature/subscription-autoplay
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests and build debug APK
        run: ./gradlew assembleContinuous lintContinuous testDebugUnitTest --stacktrace --console=plain -DskipFormatKtlint
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: subscription-autoplay-build-diagnostics
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: newpipe-subscription-autoplay-debug
          path: app/build/outputs/apk/continuous/*.apk
          if-no-files-found: error
          retention-days: 14
